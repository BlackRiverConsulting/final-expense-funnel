<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 22px; text-align: center; background: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; border: 2px solid #ccc; }
        h1 { color: #2f855a; font-size: 36px; }
        .call-btn { display: inline-block; background: #e53e3e; color: white; padding: 20px 40px; font-size: 26px; font-weight: bold; text-decoration: none; border-radius: 5px; margin-top: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Request Is Received!</h1>
        <p>An agent is checking your state's available plans right now.</p>
        <p><strong>Skip the wait time and speak to someone immediately:</strong></p>
        <a href="tel:18005555555" class="call-btn">CALL NOW: 1-800-555-5555</a>
        <p style="font-size: 16px; margin-top: 20px; color: #666;">Lines are open for seniors aged 50-85.</p>
    </div>
</body>
</html>
