<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Expense Plan Eligibility</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 22px; line-height: 1.6; text-align: center; background: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; border: 2px solid #ccc; }
        h1 { color: #1a365d; font-size: 32px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; font-size: 20px; border: 1px solid #999; border-radius: 4px; box-sizing: border-box; }
        button { background: #dd6b20; color: white; padding: 15px; width: 100%; border: none; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 4px; }
        button:hover { background: #c05621; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Check Your Eligibility For Affordable Burial Insurance</h1>
        <p>Ensure your family isn't burdened with funeral costs. Fill out the form below to see your options.</p>
        <form action="thank-you.html" method="GET">
            <label for="age">What is your age?</label>
            <input type="number" id="age" name="age" min="50" max="85" placeholder="e.g. 65" required>

            <label for="state">What state do you live in?</label>
            <input type="text" id="state" name="state" placeholder="e.g. Pennsylvania" required>

            <label for="phone">Your Best Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="555-555-5555" required>

            <button type="submit">See My Rates →</button>
        </form>
    </div>
</body>
</html>
